<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bump (Location application) Ad generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title">
            <div class="info">
                <img class="usericon" src="https://unavatar.io/x/X" alt="User Icon">
                <h4 class="screenname">X</h4>
                <p class="username">@X</p>
                <p class="time">・17時間前</p>
                <img class="options" src="images/Options.png">
            </div>
        </div>

        <div class="content">
            <h3>位置情報アプリの頂点はBumpだと思う。コロナ禍に流行ったZenlyのアプリ作った人が開発してて他位置情報アプリとレベル違う。</h3>
            <div class="attachment">
                <img class="attachment1" src="images/Attachment1.png">
                <img class="attachment2" src="images/Attachment2.png">
            </div>
        </div>

        <div class="information">
            <img class="Reply" src="images/Reply.png">
            <h3>58</h3>

            <img class="Repost" src="images/Repost.png">
            <h3>1,351</h3>

            <img class="Like" src="images/Like.png">
            <h3>1.3万</h3>

            <img class="Views" src="images/Views.png">
            <h3>417万</h3>

            <img class="Share" src="images/Share.png">
        </div>

        <form class="fetchForm">
            <input type="text" class="fetchName" placeholder="Enter username">
        </form>
        <button class="fetchButton">Fetch</button>
        <p class="fetchResult"></p>
    </div>
</body>
    <script src="script.js" defer></script>
</html>
